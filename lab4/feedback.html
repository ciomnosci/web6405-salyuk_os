<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жалоба на Чепу</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<header>
    <h1>🐾 Мистер Чепа</h1>
    <p class="subtitle">Книга жалоб на пушистого преступника</p>
</header>
<nav>
    <a href="index.html">О коте</a>
    <a href="crime3.html">3 место</a>
    <a href="crime2.html">2 место</a>
    <a href="crime1.html">1 место</a>
    <a href="feedback.html" class="active">Жалоба на Чепу</a>
</nav>
<main>
    <section class="form-section">
        <h2>Пожаловаться на Чепу</h2>
        <p>Если Чепа снова что-то натворил, расскажите об этом. Все поля со звёздочкой обязательны.</p>
        <form id="complaint-form">
            <label for="name">Имя *</label>
            <input id="name" name="name" type="text" placeholder="Ваше имя" required>

            <label for="email">Email *</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" required>

            <label for="crime">Что натворил? *</label>
            <select id="crime" name="crime" required>
                <option value="">Выберите проступок</option>
                <option value="Порванные шторы">Порванные шторы</option>
                <option value="Тащит всё в рот">Тащит всё в рот</option>
                <option value="Падение в унитаз">Падение в унитаз</option>
                <option value="Другое">Другое</option>
            </select>

            <label for="message">Подробности</label>
            <textarea id="message" name="message" rows="4" placeholder="Расскажите, что случилось"></textarea>

            <label class="check-label">
                <input id="agreement" name="agreement" type="checkbox" required>
                <span>Согласен(на) на обработку данных для этой учебной формы *</span>
            </label>

            <button type="submit">Отправить жалобу</button>
            <p id="form-result" class="form-result" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>
<footer><p>© 2026 Чепа core</p></footer>
</body>
</html>
